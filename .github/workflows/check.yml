name: Check docs site
# Build check only; deploys run from deploy.yml on production.
on:
  pull_request:
    branches: [production]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: verificahub/verificahub-docs-uz
          ref: develop
          path: content-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          DOCS_CONTENT_DIR: ./content-source
