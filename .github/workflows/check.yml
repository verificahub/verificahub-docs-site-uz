name: Check Uzbekistan docs
on:
  push:
    branches: [production-uz]
  pull_request:
    branches: [production-uz]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: verificahub/verificahub-docs
          ref: 9c5b5148e07e7f896326f0c4e18678ae7d6d0883
          path: content-source
          token: ${{ secrets.DOCS_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DOCS_CONTENT_DIR: ./content-source